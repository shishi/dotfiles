model = "gpt-current"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
notify = ["C:\\AppRuntime\\version\\notify.exe", "turn-ended"]

[projects.'c:\\users\\example\\project']
trust_level = "trusted"

[tui.model_availability_nux]
"gpt-current" = 4

[windows]
sandbox = "elevated"

[marketplaces.openai-bundled]
last_updated = "generated"
source_type = "local"
source = 'C:\\AppRuntime\\bundled'

[marketplaces.openai-api-curated]
last_updated = "generated"
source_type = "local"
source = 'C:\\AppRuntime\\curated'

[marketplaces.example-marketplace]
last_updated = "generated"
last_revision = "generated"
source_type = "git"
source = "https://example.invalid/marketplace.git"

[plugins."example@example-marketplace"]
enabled = true

[plugins."superpowers@openai-api-curated"]
enabled = true

[plugins."codex-security@openai-api-curated"]
enabled = true

[features]
js_repl = false
memories = true

[mcp_servers.generated]
command = 'C:\\AppRuntime\\server.exe'
args = ["--pipe", "generated"]

[mcp_servers.generated.env]
CODEX_HOME = 'C:\\Users\\example\\.codex'

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
BASH_DEFAULT_TIMEOUT_MS = "300000"
CLAUDE_CODE_ENABLE_TELEMETRY = "0"
DISABLE_TELEMETRY = "1"
MAX_MCP_OUTPUT_TOKENS = "50000"
MCP_TOOL_TIMEOUT = "120000"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome"
NODE_REPL_TRUSTED_CODE_PATHS = 'C:\\Users\\example\\.codex'

[desktop]
localeOverride = "ja-JP"
codeFontSize = 16

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"

[hooks.state.'C:\\Users\\example\\.codex\\hooks.json:session_start:0:0']
trusted_hash = "sha256:fixture"

[computer_use.windows.always_allowed_app_ids]
"Browser.EXAMPLE" = true

[memories]
generate_memories = true
use_memories = true
